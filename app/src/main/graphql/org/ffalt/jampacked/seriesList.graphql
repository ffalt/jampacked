query SeriesListResult($listType: ListType, $seed: String, $albumTypes: [AlbumType!], $genreIDs: [ID!], $order: [SeriesOrderParametersQL!], $take: Int!, $skip: Int!) {
    serieses(list: $listType, seed: $seed, filter: {albumTypes: $albumTypes, genreIDs: $genreIDs}, order: $order, page: {take: $take, skip: $skip}) {
        total
        skip
        take
        items {
            id
            name
            albumsCount
        }
    }
}
