query PodcastResult($id: ID!) {
    podcast(id:$id) {
        id
        name
        description
        author
        language
        categories
        episodesCount
        lastCheck
        status
        errorMessage
        episodes {
            id
            name
            date
            duration
            tag {
                title
                artist
                genres
                mediaFormat
            }
        }
    }
}
