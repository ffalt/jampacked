query TrackListResult($listType: ListType, $seed: String, $filter: TrackFilterParametersQL, $order: [TrackOrderParametersQL!], $take: Int!, $skip: Int!) {
    tracks(list: $listType, filter: $filter, order: $order, seed: $seed, page: {take: $take, skip: $skip}) {
        total
        skip
        take
        items {
            id
            name
            album {
                id
                name
            }
            artist {
                id
                name
            }
            series {
                id
                name
            }
            genres {
                id
                name
            }
            tag {
                mediaDuration
                mediaFormat
                title
                disc
                trackNr
            }
        }
    }
}
