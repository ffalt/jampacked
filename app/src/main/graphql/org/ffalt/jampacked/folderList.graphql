query FolderListResult($listType: ListType, $seed: String, $filter: FolderFilterParametersQL, $order: [FolderOrderParametersQL!], $take: Int!, $skip: Int!) {
    folders(list: $listType, seed: $seed, filter: $filter, order: $order, page: {take: $take, skip: $skip}) {
        total
        skip
        take
        items {
            id
            name
            folderType
            tracksCount
            childrenCount
        }
    }
}
