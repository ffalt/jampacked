query AlbumListResult($listType: ListType, $seed: String, $filter: AlbumFilterParametersQL, $order: [AlbumOrderParametersQL!], $take: Int!, $skip: Int!) {
    albums(list: $listType, seed: $seed, filter: $filter, order: $order, page: {take: $take, skip: $skip}) {
        total
        skip
        take
        items {
            id
            name
            artist {
                name
            }
        }
    }
}
